<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Presensi QR Code</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5 QRCode library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Animasi pop-up Toast */
        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter { animation: slideInUp 0.3s ease-out forwards; }
        /* Perbaikan tampilan container scanner */
        #reader { border-radius: 0.5rem; overflow: hidden; border: none !important; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        #reader video { object-fit: cover; border-radius: 0.5rem; }
        /* Sembunyikan pesan loading default dari library */
        #reader__dashboard_section_csr span { display: none; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

<main class="flex-grow container mx-auto px-4 py-8 max-w-2xl relative">
    
    <header class="text-center mb-8">
        <h1 class="text-3xl font-bold text-indigo-700 mb-2">Presensi Digital</h1>
        <p class="text-gray-500">Scan QR Code atau masukkan ID secara manual</p>
    </header>

    <!-- Kontrol Sesi & Pengabsen -->
    <div class="bg-white rounded-xl shadow-md p-6 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Pengabsen</label>
                <input type="text" id="pengabsenName" placeholder="Masukkan nama Anda..." 
                       class="w-full rounded-lg border-gray-300 border px-4 py-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Sesi Kegiatan</label>
                <select id="sesiSelect" class="w-full rounded-lg border-gray-300 border px-4 py-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-white">
                    <option value="Sesi 1 (Registrasi)">Sesi 1 (Registrasi)</option>
                    <option value="Sesi 2 (Malam)">Sesi 2 (Malam)</option>
                    <option value="Sesi 3 (Pagi)">Sesi 3 (Pagi)</option>
                    <option value="Sesi FGD">Sesi FGD</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Area Scanner -->
    <div class="bg-white rounded-xl shadow-md p-6 mb-6 text-center">
        <div id="reader" class="w-full max-w-sm mx-auto mb-4 bg-gray-100 min-h-[250px] flex items-center justify-center">
             <p class="text-gray-400" id="scanner-placeholder">Kamera siap diaktifkan</p>
        </div>
        
        <div class="flex justify-center gap-3 mb-6">
            <button id="btnStartScan" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-6 rounded-lg shadow transition">
                Mulai Scan
            </button>
            <button id="btnStopScan" class="bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-6 rounded-lg shadow transition hidden">
                Stop Scan
            </button>
        </div>

        <div class="relative flex py-2 items-center mb-4">
            <div class="flex-grow border-t border-gray-300"></div>
            <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">ATAU MANUAL</span>
            <div class="flex-grow border-t border-gray-300"></div>
        </div>

        <!-- Input Manual -->
        <div class="flex gap-2 max-w-sm mx-auto">
            <input type="text" id="manualId" placeholder="Masukkan ID Peserta" class="flex-grow rounded-lg border-gray-300 border px-4 py-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none text-center font-mono">
            <button id="btnManualSubmit" class="bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 px-4 rounded-lg transition">
                Proses
            </button>
        </div>
    </div>

    <!-- Tombol Buka Dashboard Belum Absen -->
    <div class="text-center pb-8">
        <button id="btnShowAbsent" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-8 rounded-full shadow-lg transition transform hover:scale-105 flex items-center justify-center mx-auto gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
            Lihat Data Belum Absen
        </button>
    </div>
</main>

<!-- Modal / Halaman Overlay untuk Data Belum Absen -->
<div id="absentModal" class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 hidden flex flex-col">
    <div class="bg-white w-full max-w-4xl mx-auto h-full md:h-[90vh] md:mt-[5vh] md:rounded-2xl shadow-2xl flex flex-col">
        <!-- Modal Header -->
        <div class="p-6 border-b border-gray-200 flex justify-between items-center bg-gray-50 md:rounded-t-2xl">
            <div>
                <h2 class="text-2xl font-bold text-gray-800" id="absentTitle">Data Belum Absen</h2>
                <p class="text-sm text-gray-500 mt-1" id="absentSubtitle">Memuat data...</p>
            </div>
            <button id="btnCloseModal" class="text-gray-500 hover:text-red-500 p-2 bg-gray-200 rounded-full transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <!-- Modal Body (List Data) -->
        <div class="p-6 overflow-y-auto flex-grow bg-white">
            <!-- Loading Indicator -->
            <div id="absentLoading" class="flex flex-col items-center justify-center py-12 hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
                <p class="text-gray-600">Sinkronisasi data dengan server...</p>
            </div>

            <!-- Error Message -->
            <div id="absentError" class="bg-red-50 text-red-600 p-4 rounded-lg hidden text-center"></div>

            <!-- Table Data -->
            <div class="overflow-x-auto hidden" id="absentTableContainer">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID / Nama</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Kelompok</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Aksi Manual</th>
                        </tr>
                    </thead>
                    <tbody id="absentTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Data rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notification (Pop-up) -->
<div id="toastContainer" class="fixed bottom-5 left-0 right-0 flex justify-center pointer-events-none z-50">
    <!-- Toasts akan muncul di sini -->
</div>

<script>
    // ==========================================
    // KONFIGURASI UTAMA
    // ==========================================
    // GANTI URL DI BAWAH INI DENGAN URL GOOGLE WEB APP ANDA!
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxaRq7piwjfckKiK74v4s-kmtGBr35ssvFJ324WMVM1eSV6Y4PG4O7WK-BDLVYAw5gidQ/exec'; 
    // ==========================================

    let html5QrcodeScanner = null;
    let isProcessing = false; // Mencegah double submit

    // DOM Elements
    const elements = {
        pengabsen: document.getElementById('pengabsenName'),
        sesi: document.getElementById('sesiSelect'),
        btnStartScan: document.getElementById('btnStartScan'),
        btnStopScan: document.getElementById('btnStopScan'),
        placeholder: document.getElementById('scanner-placeholder'),
        manualId: document.getElementById('manualId'),
        btnManualSubmit: document.getElementById('btnManualSubmit'),
        toastContainer: document.getElementById('toastContainer'),
        
        // Modal elements
        modal: document.getElementById('absentModal'),
        btnCloseModal: document.getElementById('btnCloseModal'),
        btnShowAbsent: document.getElementById('btnShowAbsent'),
        absentTitle: document.getElementById('absentTitle'),
        absentSubtitle: document.getElementById('absentSubtitle'),
        absentLoading: document.getElementById('absentLoading'),
        absentError: document.getElementById('absentError'),
        absentTableContainer: document.getElementById('absentTableContainer'),
        absentTableBody: document.getElementById('absentTableBody'),
    };

    // --- Inisialisasi Local Storage untuk Default ---
    window.onload = () => {
        const savedPengabsen = localStorage.getItem('lastPengabsen');
        const savedSesi = localStorage.getItem('lastSesi');
        if (savedPengabsen) elements.pengabsen.value = savedPengabsen;
        if (savedSesi) elements.sesi.value = savedSesi;

        // Simpan perubahan ke local storage
        elements.pengabsen.addEventListener('change', (e) => localStorage.setItem('lastPengabsen', e.target.value));
        elements.sesi.addEventListener('change', (e) => localStorage.setItem('lastSesi', e.target.value));
    };

    // --- UI Helpers ---
    function showToast(message, type = 'success', duration = 4000) {
        const toast = document.createElement('div');
        toast.className = `toast-enter max-w-sm w-full mx-4 mb-2 shadow-lg rounded-lg pointer-events-auto p-4 flex items-start ${
            type === 'success' ? 'bg-green-100 border-l-4 border-green-500' :
            type === 'error' ? 'bg-red-100 border-l-4 border-red-500' :
            'bg-blue-100 border-l-4 border-blue-500'
        }`;
        
        const icon = type === 'success' 
            ? `<svg class="w-6 h-6 text-green-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`
            : `<svg class="w-6 h-6 text-red-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

        toast.innerHTML = `
            ${icon}
            <div class="flex-1">
                <p class="text-sm font-medium ${type === 'success' ? 'text-green-800' : 'text-red-800'}">${message}</p>
            </div>
        `;
        
        elements.toastContainer.appendChild(toast);
        
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(100%)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, duration);
    }

    // --- Helper JSONP untuk API Call ---
    // Karena HTML di-host terpisah, JSONP digunakan untuk menghindari masalah CORS murni.
    function callAPI(params) {
        return new Promise((resolve, reject) => {
            const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.body.removeChild(script);
                resolve(data);
            };

            const script = document.createElement('script');
            // Jika URL adalah dummy, simulasikan response untuk testing tanpa error.
            if (GOOGLE_SCRIPT_URL.includes('GANTI_DENGAN_URL')) {
                setTimeout(() => {
                    console.warn("MENGGUNAKAN MODE SIMULASI KARENA URL GOOGLE SCRIPT BELUM DIGANTI.");
                    window[callbackName]({
                        success: true, 
                        message: "Mode Simulasi: Aksi berhasil (URL API belum disetting).",
                        data: { id: params.id || "001", nama: "Peserta Dummy", kelompok: "Kelompok A" },
                        total_belum_absen: 15
                    });
                }, 1000);
                return;
            }

            let url = GOOGLE_SCRIPT_URL + '?callback=' + callbackName;
            for (let key in params) {
                url += '&' + key + '=' + encodeURIComponent(params[key]);
            }
            
            script.src = url;
            script.onerror = () => {
                delete window[callbackName];
                reject(new Error("Gagal terhubung ke server."));
            }
            document.body.appendChild(script);
        });
    }

    // --- Proses Utama ---
    async function processAttendance(id) {
        if (isProcessing) return;
        
        const pengabsen = elements.pengabsen.value.trim();
        const sesi = elements.sesi.value;
        
        if (!pengabsen) {
            showToast('Silakan isi Nama Pengabsen terlebih dahulu!', 'error');
            elements.pengabsen.focus();
            return;
        }
        if (!id) return;

        isProcessing = true;
        showToast(`Memproses ID: ${id}...`, 'info', 2000);
        
        // Pause scanner sementara
        if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
            html5QrcodeScanner.pause();
        }

        try {
            const result = await callAPI({
                action: 'scan',
                id: id,
                sesi: sesi,
                pengabsen: pengabsen
            });

            if (result.success) {
                showToast(`✅ Berhasil!\n${result.data.nama} (${result.data.kelompok})`, 'success', 5000);
            } else {
                showToast(`❌ Gagal: ${result.message}`, 'error', 5000);
            }
        } catch (error) {
            showToast('Terjadi kesalahan koneksi.', 'error');
            console.error(error);
        } finally {
            isProcessing = false;
            elements.manualId.value = ''; // Reset input manual
            // Resume scanner
            if (html5QrcodeScanner && html5QrcodeScanner.getState() === Html5QrcodeScannerState.PAUSED) {
                setTimeout(() => { html5QrcodeScanner.resume(); }, 1500); // Jeda sebelum scan lagi
            }
        }
    }

    // Event Handler Input Manual
    elements.btnManualSubmit.addEventListener('click', () => {
        processAttendance(elements.manualId.value.trim());
    });
    elements.manualId.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') processAttendance(e.target.value.trim());
    });

    // --- Manajemen Scanner Kamera ---
    elements.btnStartScan.addEventListener('click', () => {
        elements.placeholder.style.display = 'none';
        elements.btnStartScan.classList.add('hidden');
        elements.btnStopScan.classList.remove('hidden');

        html5QrcodeScanner = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            config,
            (decodedText, decodedResult) => {
                // Saat QR berhasil discan
                processAttendance(decodedText);
            },
            (errorMessage) => {
                // Diabaikan, dipanggil terus menerus saat tidak ada QR
            }
        ).catch((err) => {
            showToast(`Gagal mengakses kamera: ${err}`, 'error');
            stopScanner();
        });
    });

    function stopScanner() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                elements.placeholder.style.display = 'block';
                elements.btnStartScan.classList.remove('hidden');
                elements.btnStopScan.classList.add('hidden');
            }).catch(err => console.error(err));
        }
    }

    elements.btnStopScan.addEventListener('click', stopScanner);

    // --- Manajemen Modal Data Belum Absen ---
    elements.btnShowAbsent.addEventListener('click', () => {
        const sesi = elements.sesi.value;
        const pengabsen = elements.pengabsen.value.trim();
        
        if (!pengabsen) {
            showToast('Isi Nama Pengabsen dulu sebelum membuka dashboard.', 'error');
            elements.pengabsen.focus();
            return;
        }

        elements.modal.classList.remove('hidden');
        elements.absentTitle.textContent = `Data Belum Absen`;
        elements.absentSubtitle.textContent = `Sesi: ${sesi}`;
        loadAbsentData(sesi);
    });

    elements.btnCloseModal.addEventListener('click', () => {
        elements.modal.classList.add('hidden');
    });

    async function loadAbsentData(sesi) {
        elements.absentTableContainer.classList.add('hidden');
        elements.absentError.classList.add('hidden');
        elements.absentLoading.classList.remove('hidden');
        elements.absentTableBody.innerHTML = '';

        try {
            const result = await callAPI({
                action: 'get_absent',
                sesi: sesi
            });

            elements.absentLoading.classList.add('hidden');

            if (result.success) {
                elements.absentSubtitle.textContent = `Sesi: ${sesi} • Total Belum: ${result.total_belum_absen} orang`;
                
                if (result.data.length === 0) {
                     elements.absentError.textContent = "Semua peserta sudah absen pada sesi ini 🎉";
                     elements.absentError.classList.remove('hidden');
                     elements.absentError.classList.replace('bg-red-50', 'bg-green-50');
                     elements.absentError.classList.replace('text-red-600', 'text-green-600');
                     return;
                }

                elements.absentTableContainer.classList.remove('hidden');
                
                result.data.forEach(user => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-50 transition-colors";
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">${user.nama}</div>
                            <div class="text-xs text-gray-500 font-mono">${user.id}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900">${user.kelompok}</div>
                            <div class="text-xs text-gray-500">${user.dapukan}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="manualUpdate('${user.id}', 'Hadir Manual', this)" class="text-emerald-600 hover:text-emerald-900 bg-emerald-100 px-3 py-1 rounded mr-2">Hadir</button>
                            <button onclick="manualUpdate('${user.id}', 'Izin', this)" class="text-amber-600 hover:text-amber-900 bg-amber-100 px-3 py-1 rounded">Izin</button>
                        </td>
                    `;
                    elements.absentTableBody.appendChild(row);
                });
            } else {
                elements.absentError.textContent = result.message;
                elements.absentError.classList.remove('hidden');
            }
        } catch (error) {
            elements.absentLoading.classList.add('hidden');
            elements.absentError.textContent = "Gagal mengambil data dari server.";
            elements.absentError.classList.remove('hidden');
        }
    }

    // Fungsi dipanggil dari tombol di dalam tabel
    window.manualUpdate = async function(id, status, btnElement) {
        const sesi = elements.sesi.value;
        const pengabsen = elements.pengabsen.value;
        
        // Visual feedback on button
        const originalText = btnElement.innerText;
        btnElement.innerText = "...";
        btnElement.disabled = true;

        try {
            const result = await callAPI({
                action: 'manual_update',
                id: id,
                sesi: sesi,
                pengabsen: pengabsen,
                status: status
            });

            if (result.success) {
                // Hapus baris dari tabel karena sudah tidak absen lagi
                const row = btnElement.closest('tr');
                row.style.backgroundColor = '#d1fae5'; // green hint
                setTimeout(() => row.remove(), 500);
                showToast(`ID ${id} ditandai: ${status}`, 'success', 3000);
                
                // Update counter secara visual (pengurangan 1)
                const subtitle = elements.absentSubtitle.textContent;
                const match = subtitle.match(/Total Belum: (\d+)/);
                if(match) {
                    const currentTotal = parseInt(match[1]);
                    elements.absentSubtitle.textContent = `Sesi: ${sesi} • Total Belum: ${currentTotal - 1} orang`;
                }

            } else {
                showToast(result.message, 'error');
                btnElement.innerText = originalText;
                btnElement.disabled = false;
            }
        } catch (error) {
            showToast("Gagal update data.", 'error');
            btnElement.innerText = originalText;
            btnElement.disabled = false;
        }
    }
</script>

</body>
</html>
